name: Exploring Workflow Dispatch Trigger

on:
  workflow_dispatch:
    inputs: 
      run-job:
        description: Run Specific Job
        required: false
        type: boolean
      custom_message:
        description: Enter a custom message
        type: string
        required: true
                  
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Exploring Workflow Dispatch Trigger"

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Printing Custom Message
        run: |
          echo "custom_message: $CUSTOM_MESSAGE"
        env:
          CUSTOM_MESSAGE: ${{ inputs.custom_message }}
